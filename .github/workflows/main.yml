    <p>I am <b>Nuraliya Batrisha</b>, or also known as Aliya. I was born on 25 October 2005, an Information Technology diploma student currently pursuing my studies since 2023, with a CGPA of 3.50. I am a motivated, responsible, and detail-oriented individual with a strong interest in the IT field, particularly in system support and problem-solving. Throughout my academic journey, I have developed a solid foundation in information technology concepts and practical applications. I am committed to continuous learning and self-improvement as I prepare myself for a professional career in IT. In my free time, I enjoy cooking, which has helped me develop patience, creativity, and the ability to follow structured processes skills that are also valuable in technical and professional environments. I believe in maintaining a balanced lifestyle while staying focused on my academic and career goals.</p>

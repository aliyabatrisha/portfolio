    <p>In addition, through the Entrepreneurship (ENT) course, I gained exposure to business fundamentals by developing business ideas, preparing basic business plans, and applying marketing, financial, and management concepts in project based learning. This experience enhanced my problem-solving, creativity, and ability to think from both technical and business perspectives.</p>
